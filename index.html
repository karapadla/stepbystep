<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Step by Step</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#1b2340;--mute:#667090;--line:#dbe0ec;--acc:#1f7f86;--acc-ink:#fff;--warm:#e0a030;--grn:#2ea05a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12162a;--card:#1c2240;--ink:#e8ebf7;--mute:#9aa3c4;--line:#2d3558;--acc:#4fc3c9;--acc-ink:#0c1a24;--warm:#f0b94d;--grn:#3dbd6e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12162a;--card:#1c2240;--ink:#e8ebf7;--mute:#9aa3c4;--line:#2d3558;--acc:#4fc3c9;--acc-ink:#0c1a24;--warm:#f0b94d;--grn:#3dbd6e;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Onest,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:28px;font-weight:800;margin:8px 0 2px;letter-spacing:-.02em}
h3{margin:0 0 8px;font-size:16px}
.date{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.date span{flex:1;color:var(--mute);text-transform:capitalize}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.ic{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px}
.plus{width:28px;height:28px;padding:0;border-radius:50%;border:1px solid var(--line);background:none;color:var(--mute);font-size:16px;line-height:1}
.plus[aria-expanded=true]{background:var(--card);color:var(--ink)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.sum b{display:block;font-size:22px;font-weight:800;color:var(--acc)}
.sum small{color:var(--mute);font-size:12px}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;padding:9px 4px;border-radius:9px;font-weight:500;color:var(--mute)}
.tabs button.on{background:var(--acc);color:var(--acc-ink);font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
form{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
input,select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
select{padding:9px 4px}
input[type=text]{flex:1 1 140px}
input[type=number]{width:84px}
.add{border:0;background:var(--acc);color:var(--acc-ink);font-weight:700;border-radius:10px;padding:9px 16px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.row.done .t{text-decoration:line-through;color:var(--mute)}
.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc);flex:none}
.tm{font-weight:700;color:var(--acc);min-width:46px}
.x{border:0;background:none;color:var(--mute);font-size:20px;line-height:1;padding:2px 6px}
.plan{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}
.plan .row{background:none}
.plan form{margin-bottom:8px}
.hero{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,var(--card),var(--bg));border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:14px}
.hero b{display:block;font-size:22px;font-weight:800}
.hero span{color:var(--mute)}
.hb{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}
.hb.done{border-color:var(--grn);box-shadow:0 0 0 1px var(--grn) inset}
.he{width:48px;height:48px;border-radius:14px;background:var(--bg);display:grid;place-items:center;font-size:26px;flex:none}
.hi{flex:1;min-width:0}
.hi b{display:block;overflow-wrap:anywhere}
.hm{display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--mute);font-size:13px}
.tag{background:var(--bg);border-radius:6px;padding:0 6px;font-size:11px}
.wk{display:flex;gap:5px;margin-top:6px}
.dt{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dt.on{background:var(--grn)}
.dt.cu{box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--mute)}
.ck{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:none;font-size:22px;font-weight:800;color:#fff;flex:none}
.hb.done .ck{background:var(--grn);border-color:var(--grn)}
.ex{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.exh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.exh b{flex:1;font-size:17px;overflow-wrap:anywhere}
.un{font-size:13px;color:var(--mute);padding:4px}
.gl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-bottom:6px}
.gl label{display:flex;align-items:center;gap:8px;flex:1}
.gl input{width:72px;padding:6px 8px}
.gl .bar{flex-basis:100%;margin:0}
.gl.ok .bar i{background:var(--grn)}
.ex form{margin:10px 0 6px}
.ex form input[type=number]{width:70px}
.rec{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:2px 0;color:var(--mute);font-size:14px}
.sm{color:var(--mute);font-size:13px;margin-top:6px}
.rst{font-size:13px;margin-top:8px;color:var(--mute)}
.mini{display:flex;gap:10px;align-items:center;color:var(--mute);font-size:13px;margin-bottom:10px}
.mini input{width:54px;padding:3px 6px;font-size:13px}
.book{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.book h3{margin:0 0 2px;font-size:17px}
.bk{display:flex;gap:12px}
.bk img,.ph{width:64px;height:90px;object-fit:cover;border-radius:6px;flex:none;border:1px solid var(--line)}
.ph{display:grid;place-items:center;font-size:28px;background:var(--bg)}
.bi{flex:1;min-width:0}
.book form{margin:8px 0 0}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--warm)}
.vh{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
label.ic{position:relative}
label.ic:focus-within{outline:2px solid var(--warm);outline-offset:2px}
.empty{color:var(--mute);text-align:center;padding:24px 8px}
.note{color:var(--mute);font-size:13px;margin-top:20px}
.cal{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:14px}
.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cal-h b{flex:1;text-align:center;text-transform:capitalize}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-g small{color:var(--mute);font-size:12px;padding:2px 0}
.cal-g button{border:1px solid transparent;background-color:transparent;border-radius:10px;padding:8px 0;font-weight:500}
.cal-g button.td{border-color:var(--mute)}
.cal-g button.sel{box-shadow:inset 0 0 0 2px var(--ink);font-weight:800}
.cal-g button.full{color:#fff;font-weight:700}
body{background:radial-gradient(900px 420px at 100% -10%,rgba(123,92,240,.16),transparent),radial-gradient(700px 420px at -10% 5%,rgba(46,160,90,.16),transparent),var(--bg);background-attachment:fixed}
h1{background:linear-gradient(90deg,#2ea05a,#1f8fd0,#7b5cf0);-webkit-background-clip:text;background-clip:text;color:transparent;display:block;width:fit-content}

.sum div:nth-child(1){border-top-color:#2ea05a}.sum div:nth-child(1) b{color:#2ea05a}

.sum div:nth-child(3){border-top-color:#7b5cf0}.sum div:nth-child(3) b{color:#7b5cf0}
.tabs button:not(.on){color:var(--tc)}

.hero{background:linear-gradient(135deg,rgba(46,160,90,.18),rgba(31,143,208,.12))}

.stars{display:flex;gap:2px;margin-top:6px}

.st.on{color:#f0b429}
textarea{flex:1 1 100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;color:inherit;resize:vertical;min-width:0}
textarea:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
.cms{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}

.ai{display:block;max-width:100%;max-height:260px;border-radius:8px;margin-top:6px}

.tabs button{font-size:15px}

.de{background:var(--card);border:1px solid var(--line);border-left:4px solid #d9559b;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.dh{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:13px}
.de p{margin:4px 0 0;overflow-wrap:anywhere}
.dt2{color:var(--mute);font-size:13px;margin:14px 0 6px}
form[data-f=diary] .add{background:#d9559b;color:#fff}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.mcard h3{margin:0 0 10px}

.ygrid{display:grid;grid-template-columns:20px repeat(12,1fr);gap:3px;text-align:center;font-size:11px;color:var(--mute);align-items:center}

<script>
var K='tracker-v1',tab='habits',cur=iso(new Date()),cm=cur.slice(0,7),mm=cm,mview='m',calOpen=false,planOpen=false,openEx=null,openBk=null,newEx=false,newBk=false,bsub='now',dDraft='',ASSETS=null,AT=false,dPend=[],dErr='',dBusy=false,ovOpen=null,ovMsg='',sdMenu=false,sdLast=0,sdDig=0,medMin=10,wl=null,flash='',dlg=null,md=null,wkT=0,wkDone={},rest=null,dq='',dtag='',dSearch=false,qq='',wsum='',wsumWk='',wsumBusy=false,bkQ='',bkRes=[],bkCl=[],bkClQ='',bkBusy=false,bkErr='',SMP=null,undo=null,undoT,_u=0,S;
var TABS={habits:'Звички',work:'Вправи',read:'Читання',diary:'Щоденник',stats:'Огляд'};

var PAL=['#f06a4f','#e0a030','#2ea05a','#1f8fd0','#7b5cf0','#d9559b'],TC={habits:'#2a9457',work:'#e0563a',read:'#6c4be0',diary:'#c93d86',stats:'#1f8fd0'};
function colr(id){return PAL[Math.abs(id)%PAL.length]}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function uid(){return Date.now()*1000+(++_u)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function low(s){return String(s).toLowerCase()}
function save(){try{S._ts=Date.now();localStorage.setItem(K,JSON.stringify(S))}catch(e){}if(typeof SY!=='undefined'&&SY.on&&SY.ready)sySchedule()}
function libBy(n){return S.lib.filter(function(x){return low(x.name)===low(n)})[0]}
function same(w,x){return low(w.name)===low(x.name)}
function kindOf(n){return /судок/i.test(n)?'sudoku':/медитац/i.test(n)?'med':/чит/i.test(n)?'read':/спорт|трен|вправ/i.test(n)?'sport':''}
function init(){
  var fresh=false;try{fresh=!localStorage.getItem(K)}catch(e){}
  try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
  S=S||{};S.tasks=S.tasks||[];S.diary=S.diary||[];S.moods=S.moods||{};S.tpl=S.tpl||[];S.set=S.set||{theme:'auto',tabs:{}};S.set.tabs=S.set.tabs||{};if(fresh)S.set.sum=true;S.sd=S.sd||{g:null,w:{}};S.sd.w=S.sd.w||{};S.sd.b=S.sd.b||{};S.sd.n=S.sd.n||{};S.sd.st=S.sd.st||{cur:0,best:0};S.aw=S.aw||{};S.cel=S.cel||{};S.chal=S.chal||{};S.medlog=S.medlog||[];S.work=S.work||[];S.books=S.books||[];S.lib=S.lib||[];S.goals=S.goals||{};S.goals.read=S.goals.read||{d:0};
  S.habits=S.habits||[{id:1,name:'Читання',emo:'📖',kind:'read',done:{}},{id:2,name:'Спорт',emo:'💪',kind:'sport',done:{}}];
  S.habits.forEach(function(h){if(h.kind===undefined)h.kind=/чит/i.test(h.name)?'read':/спорт|трен|вправ/i.test(h.name)?'sport':'';if(!h.emo)h.emo=h.kind==='read'?'📖':h.kind==='sport'?'💪':'✨';if(h.kind==='sport'&&h.sx===undefined){h.sx=true;h.th=50}h.done=h.done||{};h.fr=h.fr||'d';h.n=h.n||3;h.sk=h.sk||{}});
  S.lib.forEach(function(x){if(x.gu===undefined){x.gu='reps';x.gd=0;x.gw=0}});
  S.books.forEach(function(b){if(!b.st)b.st='now';b.cm=b.cm||[];b.rate=b.rate||0});
  if(!S.v2){S.work.forEach(function(w){if(!libBy(w.name))S.lib.push({id:uid(),name:w.name,emo:w.emo||'💪',sets:w.sets||0,reps:w.reps||0,kg:w.kg||0,min:w.min||0,gu:'reps',gd:0,gw:0})});S.v2=1;save()}
}
function shift(n){var d=new Date(cur+'T12:00');d.setDate(d.getDate()+n);cur=iso(d);cm=cur.slice(0,7);render()}
function weekDates(){var d=new Date(cur+'T12:00'),a=[];d.setDate(d.getDate()-(d.getDay()+6)%7);for(var i=0;i<7;i++){a.push(iso(d));d.setDate(d.getDate()+1)}return a}
function pagesOn(d){return S.books.reduce(function(a,b){return a+(b.log[d]||0)},0)}
function auto(h,d){return h.kind==='read'?pagesOn(d)>0:h.kind==='sport'?!!h.sx&&exDayPct(d)>=(h.th||50):false}
function hd(h,d){return !!(h.done[d]||auto(h,d))}
function renderToast(){document.getElementById('toast').innerHTML=undo?'<div class="toast"><span>'+esc(undo.msg)+'</span><button data-undo="1">Скасувати</button></div>':(flash?'<div class="toast"><span>'+esc(flash)+'</span></div>':'')}
function withUndo(msg,fn){var snap=JSON.stringify({lib:S.lib,work:S.work,diary:S.diary,habits:S.habits,tpl:S.tpl});fn();save();undo={snap:snap,msg:msg};clearTimeout(undoT);undoT=setTimeout(function(){undo=null;renderToast()},7000);render()}
function readImg(file,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,240/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.75))};im.onerror=function(){cb('')};im.src=r.result};r.onerror=function(){cb('')};r.readAsDataURL(file)}
function render(){
  if(visTabs().indexOf(tab)<0)tab='habits';
  document.getElementById('dl').textContent=new Date(cur+'T12:00').toLocaleDateString('uk-UA',{weekday:'short',day:'numeric',month:'long'});
  document.getElementById('plan').setAttribute('aria-expanded',planOpen);

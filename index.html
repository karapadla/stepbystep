<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Step by Step</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Step by Step">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <div class="app">
    <header class="hd">
      <div class="hdr">
        <div class="logo"><svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><path d="M6 26h7a5 5 0 0 0 0-10h-2a5 5 0 0 1 0-10h15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="6" cy="26" r="2.6" fill="currentColor"/><circle cx="26" cy="6" r="2.6" fill="var(--acc)"/></svg></div>
        <div class="hdt"><b>Step by Step</b></div>
        <div class="hdp"><span class="pg" id="pg">0% звичок</span><button class="gear" id="set" aria-label="Налаштування">⚙</button></div>
      </div>
      <nav class="tabs" id="tabs" aria-label="Розділи"></nav>
    </header>
    <div class="bd" id="bd">
      <div class="date">
        <button class="ic" id="prev" aria-label="Попередній день">‹</button>
        <span id="dl"></span>
        <button class="plus" id="plan" aria-label="Плани на день" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="ic" id="cal" aria-label="Відкрити календар"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14" rx="3"/><path d="M8 3.5v4M16 3.5v4M4 10h16"/></svg></button>
        <button class="ic" id="today">Сьогодні</button>
        <button class="ic" id="next" aria-label="Наступний день">›</button>
      </div>
      <div id="calbox"></div>
      <div id="planbox"></div>
      <div id="view"></div>
      
    </div>
  </div>
</main>
<div id="toast"></div>
<div id="ov"></div>
<div id="dlg"></div>
<div id="rest"></div>
<script src="js/core.js"></script>
<script src="js/habits.js"></script>
<script src="js/modals.js"></script>
<script src="js/workouts-books.js"></script>
<script src="js/diary.js"></script>
<script src="js/sound-reminders.js"></script>
<script src="js/sudoku-meditation.js"></script>
<script src="js/overlays-stats.js"></script>
<script src="js/icons-awards.js"></script>
<script src="js/sync-data.js"></script>
<script src="js/calendar-events.js"></script>
<script src="js/journeys.js"></script>
<script src="js/main.js"></script>
</body>
</html>
